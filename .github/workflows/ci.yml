name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # This is the monitoring helper, not a printer-control integration.
      - name: Build native monitoring helper (macOS and Linux)
        if: runner.os != 'Windows'
        run: pnpm run build:fallback
      - name: Build native monitoring helper (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: call scripts\build-fallback-windows.cmd
      - name: Smoke-test native monitoring helper without a printer
        run: node scripts/check-fallback-build.cjs
